# Self-service configuration for this repository, applied by ASF Infra
# automation. Reference: https://github.com/apache/infrastructure-asfyaml
#
# This file only takes effect once it has landed on the default branch.
# The context name below must match the job name in
# .github/workflows/ci.yml exactly - a red CI therefore blocks every
# merge into main. Merge buttons are deliberately left at the ASF
# defaults until the project picks a merge policy on the dev list.

github:
  description: "Apache Sourcelume Registry: reference registry for AI training-data provenance records"
  homepage: https://sourcelume.apache.org

  protected_branches:
    main:
      required_status_checks:
        contexts:
          - "Maven verify (JDK 21)"

notifications:
  commits: commits@sourcelume.apache.org
  pullrequests: dev@sourcelume.apache.org
  jobs: commits@sourcelume.apache.org
