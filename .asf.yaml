# Self-service configuration for this repository, applied by ASF Infra
# automation. Reference: https://github.com/apache/infrastructure-asfyaml
#
# This file only takes effect once it has landed on the default branch.
# The context name below must match the job name in
# .github/workflows/ci.yml exactly - a red CI therefore blocks every
# merge into main. The ruleset below requires squash merges for PRs
# targeting main.

github:
  description: "Apache Sourcelume Registry: reference registry for AI training-data provenance records"
  homepage: https://sourcelume.apache.org

  features:
    issues: true

  protected_branches:
    main:
      required_status_checks:
        contexts:
          - "Maven verify (JDK 21)"

  rulesets:
    - name: "Squash merges on main"
      target: branch
      enforcement: active
      conditions:
        ref_name:
          include:
            - refs/heads/main
          exclude: []
      rules:
        - type: pull_request
          parameters:
            allowed_merge_methods:
              - squash
            dismiss_stale_reviews_on_push: false
            require_code_owner_review: false
            require_last_push_approval: false
            required_approving_review_count: 0
            required_review_thread_resolution: false

notifications:
  commits: commits@sourcelume.apache.org
  issues: issues@sourcelume.apache.org
  pullrequests: dev@sourcelume.apache.org
  jobs: commits@sourcelume.apache.org
