# Apache Sourcelume Registry — Quarkus runtime configuration.

# HTTP (health at /q/health/{ready,live}, metrics at /q/metrics)
quarkus.http.port=${SERVER_PORT:8082}

# SmallRye Health: readiness/liveness probes at /q/health/{ready,live}
quarkus.smallrye-health.enabled=true

# OpenAPI document at /q/openapi, Swagger UI at /q/swagger-ui (also in the packaged runtime)
quarkus.smallrye-openapi.info-title=Apache Sourcelume Registry API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=Submit, validate and query Apache Sourcelume provenance records.
quarkus.smallrye-openapi.info-license-name=Apache License 2.0
quarkus.smallrye-openapi.info-license-url=https://www.apache.org/licenses/LICENSE-2.0
quarkus.swagger-ui.always-include=true
# Document only the status codes the resources return
quarkus.smallrye-openapi.auto-add-bad-request-response=false

# Generic storage policy; each distribution selects its provider.
sourcelume.storage.require-atomic-writes=${SOURCELUME_STORAGE_REQUIRE_ATOMIC_WRITES:false}
