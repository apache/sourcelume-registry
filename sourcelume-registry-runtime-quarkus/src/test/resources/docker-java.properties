# docker-java client configuration for the integration tests.
#
# Recent Docker/moby releases (Docker 29, and Rancher Desktop's moby)
# refuse API versions below 1.44/1.41; the version bundled with
# Testcontainers defaults to 1.32 and the handshake is rejected with
# "client version 1.32 is too old". Pinning a modern API version here
# makes the client speak a version current daemons accept
# (see testcontainers-java#11210).
api.version=1.44
