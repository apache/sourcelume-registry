# PostgreSQL instance for the registry's `postgres` storage plugin
# (sourcelume.storage.provider=postgres). This database is independent of
# the Atlas stack: `atlas-db` belongs to Apache Atlas itself.
services:
  registry-postgres:
    image: postgres:17-alpine
    container_name: registry-postgres
    environment:
      POSTGRES_USER: sourcelume
      POSTGRES_PASSWORD: sourcelume
      POSTGRES_DB: sourcelume_registry
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sourcelume -d sourcelume_registry"]
      interval: 5s
      timeout: 3s
      retries: 20
