# This file does NOT define Apache Atlas itself. Atlas is built and run using
# its own official tooling, vendored via ./setup.sh into ./vendor/atlas-docker/
# (see README.md for the full reasoning: Atlas's own dev-support/atlas-docker
# already handles a from-source build, backend choice (postgres/hbase), and
# version pinning - duplicating that by hand here would just be a second copy
# to keep in sync).
#
# What THIS file owns:
#   - the shared `sourcelume-network` that Atlas's containers join once started
#     (see README.md, "Joining the shared network")
#   - any Sourcelume-specific local dev services (a local queue, a local cache)
#     once sourcelume-registry-messaging / sourcelume-registry-cache have a
#     chosen backend - see docs/architecture.md open questions.
#
# There are no Sourcelume services defined yet: the WiringSpike (and future
# ingest-worker) currently run on the host via `mvn exec:java` and reach Atlas
# at localhost, so nothing Sourcelume-side needs to be inside Docker yet.

networks:
  sourcelume-network:
    name: sourcelume-network
    driver: bridge

services: {}

