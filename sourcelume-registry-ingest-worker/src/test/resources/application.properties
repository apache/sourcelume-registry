# Test profile: no Atlas backend available.
# - bootstrap off so @QuarkusTest startup does not retry against Atlas
# - URL pointed at a guaranteed-closed port so the readiness check reports
#   DOWN deterministically (also in CI)
sourcelume.atlas.url=http://localhost:1
sourcelume.atlas.bootstrap-on-startup=false

quarkus.log.console.level=WARN

# The scheduled poll is exercised directly by IngestSchedulerTest; a live
# tick inside @QuarkusTest would only log against the unreachable fake URL.
quarkus.scheduler.enabled=false
