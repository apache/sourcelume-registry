server:
  port: ${SERVER_PORT:8082}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9001}
  endpoint:
    health:
      probes:
        enabled: ${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
      show-details: always
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}

sourcelume:
  atlas:
    url: ${SOURCELUME_ATLAS_URL:http://localhost:21000}
    user: ${SOURCELUME_ATLAS_USER:admin}
    password: ${SOURCELUME_ATLAS_PASSWORD:atlasR0cks!}
    password-file: ${SOURCELUME_ATLAS_PASSWORD_FILE:}
    spec-context-resource: context/0.0.1/sourcelume.jsonld
    typedefs-resource: models/sourcelume/sourcelume_model.json
    bootstrap-on-startup: ${SOURCELUME_ATLAS_BOOTSTRAP_ON_STARTUP:true}
