# Default distribution: the runtime discovers the PostgreSQL plugin through the SPI.
sourcelume.storage.provider=${SOURCELUME_STORAGE_PROVIDER:postgres}
sourcelume.storage.require-atomic-writes=${SOURCELUME_STORAGE_REQUIRE_ATOMIC_WRITES:true}

sourcelume.postgres.jdbc-url=${SOURCELUME_POSTGRES_JDBC_URL:jdbc:postgresql://localhost:55432/sourcelume_registry}
sourcelume.postgres.username=${SOURCELUME_POSTGRES_USERNAME:sourcelume}
sourcelume.postgres.password=${SOURCELUME_POSTGRES_PASSWORD:sourcelume}
