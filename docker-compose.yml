networks:
  sourcelume-network:
    name: sourcelume-network
    external: true

services:
  worker:
    build:
      context: .
      dockerfile: sourcelume-registry-ingest-worker/Dockerfile
    image: apache/sourcelume-registry-app-worker:0.0.1
    container_name: sourcelume-worker
    environment:
      SOURCELUME_ATLAS_URL: ${SOURCELUME_ATLAS_URL:-http://atlas:21000}
      SOURCELUME_ATLAS_USER: ${SOURCELUME_ATLAS_USER:-admin}
      SOURCELUME_ATLAS_PASSWORD: ${SOURCELUME_ATLAS_PASSWORD:-atlasR0cks!}
      SOURCELUME_ATLAS_PASSWORD_FILE: ${SOURCELUME_ATLAS_PASSWORD_FILE:-}
      MANAGEMENT_SERVER_PORT: "9001"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
      JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
    ports:
      - "8082:8082"
      - "9001:9001"
    networks:
      - sourcelume-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9001/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: on-failure
