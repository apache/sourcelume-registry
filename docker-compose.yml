# Default registry distribution, backed directly by PostgreSQL.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sourcelume_registry
      POSTGRES_USER: sourcelume
      POSTGRES_PASSWORD: ${SOURCELUME_POSTGRES_PASSWORD:-sourcelume}
    volumes:
      - registry-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sourcelume -d sourcelume_registry"]
      interval: 5s
      timeout: 3s
      retries: 20

  registry:
    build:
      context: ./sourcelume-registry-distribution-postgres
      dockerfile: Dockerfile
    image: apache/sourcelume-registry-postgres:0.0.1
    environment:
      SOURCELUME_POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/sourcelume_registry
      SOURCELUME_POSTGRES_USERNAME: sourcelume
      SOURCELUME_POSTGRES_PASSWORD: ${SOURCELUME_POSTGRES_PASSWORD:-sourcelume}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/q/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: on-failure

volumes:
  registry-data:
