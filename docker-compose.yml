# Quarkus spike — Sourcelume ingest worker container.
# The Apache Atlas backend is stood up via dev-support/vendor/atlas-docker (see dev-support/README.md);
# this compose runs the Quarkus worker connected to Atlas via the shared `sourcelume-network`.

networks:
  sourcelume-network:
    name: sourcelume-network
    external: true

services:
  worker:
    build:
      context: .
      dockerfile: sourcelume-registry-ingest-worker/Dockerfile
    image: apache/sourcelume-registry-app-worker-quarkus:0.0.1
    container_name: sourcelume-worker-quarkus
    environment:
      SOURCELUME_ATLAS_URL: ${SOURCELUME_ATLAS_URL:-http://atlas:21000}
      SOURCELUME_ATLAS_USER: ${SOURCELUME_ATLAS_USER:-admin}
      SOURCELUME_ATLAS_PASSWORD: ${SOURCELUME_ATLAS_PASSWORD:-atlasR0cks!}
      SOURCELUME_ATLAS_PASSWORD_FILE: ${SOURCELUME_ATLAS_PASSWORD_FILE:-}
      SOURCELUME_ATLAS_BOOTSTRAP_ON_STARTUP: "true"
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
    ports:
      - "8082:8082"
    networks:
      - sourcelume-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/q/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: on-failure
