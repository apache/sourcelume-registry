name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven-verify:
    name: Maven verify (JDK 21)
    runs-on: ubuntu-latest
    steps:
      # Both repositories are checked out into subdirectories so the
      # registry's RAT and Spotless never scan the spec checkout.
      - name: Checkout registry
        uses: actions/checkout@v4
        with:
          path: registry

      # Pinned so a spec change cannot turn this repository's build red on its
      # own: the validators and docs/openapi.yaml embed the spec's schemas. To
      # pick up a newer spec, change the revision here in a pull request - its
      # CI run and the regenerated docs/openapi.yaml then show the effect.
      # b5ab8e7: "Add TrainingProvenanceRecord" (sourcelume-spec #10).
      - name: Checkout spec
        uses: actions/checkout@v4
        with:
          repository: apache/sourcelume-spec
          ref: b5ab8e7b36ed84c43c19e7e1b4ae816bee53427c
          path: spec

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      # The spec jar is not published to any repository yet; build it from
      # main and install it into the local repository. working-directory
      # (instead of -f) keeps Maven anchored in the respective checkout, so
      # ${maven.multiModuleProjectDirectory} points at the registry, not the
      # workspace root.
      - name: Install spec (sourcelume-spec)
        working-directory: spec
        run: mvn -B install -DskipTests -Drat.skip -Dspotless.check.skip -Dcheckstyle.skip

      - name: Build and verify registry
        working-directory: registry
        run: mvn -B verify

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: registry/**/target/surefire-reports/
          if-no-files-found: ignore
